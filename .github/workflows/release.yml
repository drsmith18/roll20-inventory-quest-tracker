# Builds the store-uploadable zips for a tagged release.
#
# Deliberately NOT a build step: nothing here transpiles, bundles or minifies.
# Shipping exactly the source we write is what lets reviewers read the real
# code, and it keeps us out of AMO's source-submission process entirely. This
# workflow only selects files and zips them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Never ship an untested tag.
      - name: Run the test suite
        run: npm test

      # The tag is the release's identity; if it disagrees with the manifest,
      # the artifact would be mislabelled everywhere it lands.
      - name: Check the tag matches the manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./extension/manifest.json').version")
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST"
            exit 1
          fi

      - name: Build the store zips
        run: |
          set -euo pipefail
          mkdir -p dist build
          # Zip the CONTENTS of extension/, never the folder itself — a
          # wrapping directory is a standard store rejection.
          cp -r extension/. build/
          cp LICENSE build/

          # Firefox needs browser_specific_settings (the gecko id and the
          # Firefox 128 floor that `world: MAIN` requires).
          (cd build && zip -qr ../dist/firefox.zip .)

          # Chrome does not understand that key and warns about it, so the
          # Chrome artifact drops it. This removes a key; it does not
          # transform any code.
          node -e '
            const fs = require("fs");
            const p = "build/manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            delete m.browser_specific_settings;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          '
          (cd build && zip -qr ../dist/chrome.zip .)

          echo "--- contents ---"
          unzip -l dist/chrome.zip
          unzip -l dist/firefox.zip

      # Fail loudly rather than uploading an artifact missing its icons.
      - name: Verify the zips
        run: |
          set -euo pipefail
          for z in dist/chrome.zip dist/firefox.zip; do
            for required in manifest.json src/main.js icons/icon128.png LICENSE; do
              unzip -l "$z" | grep -q "$required" || { echo "::error::$z is missing $required"; exit 1; }
            done
          done
          # A wrapping directory would show up as every path sharing one prefix.
          if unzip -l dist/chrome.zip | grep -qE " extension/"; then
            echo "::error::zip contains a wrapping extension/ directory"
            exit 1
          fi

      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "No changelog section for $VERSION." > dist/notes.md
          fi
          cat dist/notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/chrome.zip dist/firefox.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/notes.md
